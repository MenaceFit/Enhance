[project]
name = "enhance-api"
version = "0.1.0"
description = "Vinted AI Photo Enhancer — API, workers and non-destructive imaging engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "boto3>=1.34",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "email-validator>=2.2",
]

[project.optional-dependencies]
# External AI providers are optional: the default local engine needs none of them.
anthropic = ["anthropic>=0.70"]
rembg = ["rembg>=2.0.57", "onnxruntime>=1.18"]
stripe = ["stripe>=10.0"]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
