# Full stack: PostgreSQL, Redis, API, Celery worker + scheduler, web.
#   cp .env.example .env   (set SECRET_KEY and ADMIN_EMAILS)
#   docker compose up --build
# Then open http://localhost:3000 (API docs: http://localhost:8000/api/docs).
# Photos are stored privately in the "storage" volume; set STORAGE_BACKEND=s3 and the
# S3_* variables in .env to use AWS S3 / Cloudflare R2 instead.
x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  DATABASE_URL: postgresql+psycopg://vai:vai@postgres:5432/vai
  AUTO_CREATE_SCHEMA: "false"
  JOB_BACKEND: celery
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  LOCAL_STORAGE_PATH: /app/var/storage
  S3_BUCKET: ${S3_BUCKET:-vinted-ai}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  AI_ROUTING: ${AI_ROUTING:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
  REPLICATE_UPSCALE_VERSION: ${REPLICATE_UPSCALE_VERSION:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_IDS: ${STRIPE_PRICE_IDS:-}
  GUEST_CREDITS: ${GUEST_CREDITS:-3}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS:-30}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vai, POSTGRES_PASSWORD: vai, POSTGRES_DB: vai }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vai"], interval: 5s, retries: 10 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
    restart: unless-stopped

  migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on: { postgres: { condition: service_healthy } }

  api:
    build: ./apps/api
    environment: *api-env
    volumes: [storage:/app/var/storage]
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: ./apps/api
    healthcheck: { disable: true }  # the image healthcheck probes the HTTP API, which only "api" serves
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=${WORKER_CONCURRENCY:-2}"]
    environment: *api-env
    volumes: [storage:/app/var/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  beat:
    build: ./apps/api
    healthcheck: { disable: true }  # the image healthcheck probes the HTTP API, which only "api" serves
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment: *api-env
    volumes: [storage:/app/var/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args: { API_URL: http://api:8000, NEXT_PUBLIC_BRAND_NAME: "${BRAND_NAME:-Vinted AI}" }
    environment: { API_URL: http://api:8000 }
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  storage:
